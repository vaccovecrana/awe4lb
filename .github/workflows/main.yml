name: Native Build

on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Display release tag
        run: echo "${{ github.event.release.tag_name }}"
      - name: Pull Docker Image
        run: docker pull gradle:jdk21-graal-jammy
      - name: Gradle Build
        run: |
          docker run --rm \
            -e "GITHUB_REF=${{ github.ref }}" \
            -e "GITHUB_SHA=${{ github.sha }}" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            gradle:jdk21-graal-jammy \
            ./gradlew --no-daemon clean build :a4lb-linux-amd64:nativeCompile
      - name: Generate checksum
        run: |
          cd a4-lb/build/native/nativeCompile
          sha256sum a4lb-linux-amd64 > a4lb-linux-amd64.sha256
      - name: Upload binaries
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: a4-lb/build/native/nativeCompile/a4lb-*
          file_glob: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/awe4lb
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./a4-lb
          file: ./a4-lb/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

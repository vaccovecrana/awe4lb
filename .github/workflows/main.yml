name: Native Build

on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Display release tag
        run: echo "${{ github.event.release.tag_name }}"
      - name: Pull Docker Image
        run: docker pull gradle:9.8.2-jdk25-graal-resolute
      - name: Gradle Build
        run: |
          docker run --rm \
            -e "GITHUB_REF=${{ github.ref }}" \
            -e "GITHUB_SHA=${{ github.sha }}" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            gradle:9.8.2-jdk25-graal-resolute \
            gradle --no-daemon clean build :a4lb-linux-amd64:nativeCompile
      - name: Upload binaries
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: a4-lb/build/native/nativeCompile/a4lb-*
          file_glob: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./a4-lb
          file: ./a4-lb/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/awe4lb:${{ github.ref_name }}
          provenance: true
          sbom: true
